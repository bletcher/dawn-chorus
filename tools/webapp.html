<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn Chorus — control panel</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121926; --edge:#1e2a3d; --ink:#eef2f8; --dim:#8fa3bf;
    --accent:#5eead4; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80; --info:#7dd3fc;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--edge)}
  h1{margin:0;font-size:19px} h1 span{color:var(--dim);font-weight:400}
  .sub{color:var(--dim);font-size:13px;margin-top:5px}
  main{padding:22px 28px;max-width:1200px}

  .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
        padding:16px;margin-bottom:14px}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .card h2{margin:0 0 2px;font-size:15px}
  .rec{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .stats{display:flex;gap:18px}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .new b{color:var(--warn)} .new.zero b{color:var(--dim)}
  .note{color:var(--dim);font-size:12px;margin:9px 0 0;border-left:2px solid var(--edge);padding-left:9px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:13px}

  button{background:#1b2740;color:var(--ink);border:1px solid var(--edge);border-radius:7px;
         padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){background:#24334f;border-color:#33456b}
  button.primary{background:var(--accent);color:#04231d;border-color:var(--accent);font-weight:600}
  button.small{padding:4px 9px;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  a.btn{text-decoration:none;display:inline-block}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;
     letter-spacing:.6px;padding:6px 8px;border-bottom:1px solid var(--edge)}
  td{padding:6px 8px;border-bottom:1px solid #16202f;font-variant-numeric:tabular-nums}
  tr:hover td{background:#151f2f}
  td.name{font-family:var(--mono);font-size:12px}
  td.num{text-align:right}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .p-processed{background:#12301f;color:var(--ok)}
  .p-new{background:#3a2c08;color:var(--warn)}
  .p-changed{background:#3a2c08;color:var(--warn)}
  .p-missing{background:#3a1414;color:var(--bad)}
  .p-unparseable{background:#3a1414;color:var(--bad)}
  .p-cued{background:#1b2740;color:var(--info)}
  .p-running{background:#0b2a33;color:var(--accent)}
  /* per-row bar: sits under the pill so the status column shows state AND progress */
  .rowbar{height:3px;background:#0a1220;border-radius:99px;overflow:hidden;margin-top:4px;
          min-width:74px}
  .rowbar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
  .rowbar.indet i{width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);
                  animation:slide 1.2s linear infinite}
  tr.active td{background:#101c22}
  .dz{margin-top:12px;border:1.5px dashed var(--edge);border-radius:9px;padding:14px;
      text-align:center;color:var(--dim);font-size:13px;cursor:pointer}
  .dz.over{border-color:var(--accent);color:var(--ink);background:#101c22}
  .prog{height:4px;background:#0a1220;border-radius:99px;overflow:hidden;margin-top:8px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

  #log{background:#070a10;border:1px solid var(--edge);border-radius:10px;padding:13px 15px;
       font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;
       min-height:120px;max-height:38vh;overflow:auto;color:#c9d6ea}
  .status{font-size:12.5px;color:var(--dim);margin:9px 0 0;font-family:var(--mono)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
  .dot.running{background:var(--warn);animation:p 1s infinite}
  .dot.done{background:var(--ok)} .dot.failed{background:var(--bad)}
  @keyframes p{50%{opacity:.3}}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
  .hint{color:var(--dim);font-size:12px;margin-top:14px}
  .warnbox{background:#3a2c08;color:#fde68a;border-radius:7px;padding:9px 12px;font-size:12.5px;
           margin-top:10px;display:none}
  .store{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
         padding:14px 16px;margin-bottom:16px}
  .store .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .store .pathrow{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .store input[type=text]{flex:1;min-width:260px;background:#0a1220;color:var(--ink);
      border:1px solid var(--edge);border-radius:7px;padding:7px 10px;font-family:var(--mono);
      font-size:12.5px}
  .disk{color:var(--dim);font-size:12px;margin-top:7px;font-family:var(--mono)}
  .disk b{color:var(--ink)} .disk.low b{color:var(--bad)}
  .flash{font-size:12.5px;margin-top:9px;padding:8px 11px;border-radius:7px;display:none}
  .flash.info{background:#0b2a33;color:#a5e8f7;display:block}
  .flash.good{background:#12301f;color:#bbf7d0;display:block}
  .flash.bad{background:#3a1414;color:#fecaca;display:block}
  tr.fresh td{background:#132a1e}
  .watch{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .job{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
       padding:13px 15px;margin-bottom:12px}
  .jhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
         font-size:13px}
  .jhead #jphase{font-weight:600}
  .jhead #jcount{font-family:var(--mono);font-size:12.5px;color:var(--dim);
                 font-variant-numeric:tabular-nums}
  .jbar{height:8px;background:#0a1220;border-radius:99px;overflow:hidden;margin:9px 0 7px;
        position:relative}
  .jbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);
          transition:width .3s ease;position:absolute;top:0;left:0}
  /* work in flight sits behind banked work: dimmer, and gently pulsing so a long first
     batch reads as "running" instead of "stuck at zero". */
  .jbar #jghost{background:#1f6f63;opacity:.85;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .jbar.done #jghost, .jbar.failed #jghost{display:none;animation:none}
  .jbar.indet i{width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);
                animation:slide 1.2s linear infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .jbar.done i{background:var(--ok)} .jbar.failed i{background:var(--bad)}
  .jmeta{display:flex;justify-content:space-between;gap:12px;color:var(--dim);
         font-size:11.5px;font-family:var(--mono)}
  .jmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>Dawn Chorus <span>— control panel</span></h1>
  <div class="sub">Recordings and inference stay on this machine. Only detections are ever published.</div>
</header>

<main>
  <div class="store">
    <div class="lbl">Recordings folder</div>
    <div class="pathrow">
      <input type="text" id="root" spellcheck="false" placeholder="F:/dev/dawn-chorus">
      <button id="browse">Browse…</button>
      <button id="saveRoot">Use this folder</button>
    </div>
    <div class="disk" id="disk"></div>
    <div class="flash" id="storeMsg"></div>
  </div>

  <div class="bar">
    <button class="primary" id="check">Check for new files</button>
    <span class="watch" id="watch"></span>
  </div>

  <div id="cards"></div>

  <div class="bar">
    <button class="primary" data-cmd="all">Process all new + rebuild dashboards</button>
    <button data-cmd="compare">Compare recorders</button>
    <button data-cmd="publish">Publish (commit)</button>
    <button data-cmd="publish" data-push="1">Publish + push live</button>
    <button id="refresh">Refresh</button>
  </div>

  <div class="job" id="job" hidden>
    <div class="jhead">
      <span id="jphase">—</span>
      <span id="jcount"></span>
    </div>
    <div class="jbar"><i id="jghost"></i><i id="jfill"></i></div>
    <div class="jmeta"><span id="jcur"></span><span id="jtime"></span></div>
  </div>

  <div id="log">Ready.</div>
  <div class="status" id="status"></div>
  <div class="hint">Runs are incremental — only recordings not already analysed are processed,
    unless you tick specific files and use <b>Run selected</b>.</div>
</main>

<script>
const $ = s => document.querySelector(s);
let poll = null, seen = 0, FILES = {};      // dep -> rows
let SIG = {}, FRESH = {}, watchTimer = null, rootTouched = false;
let JOBSEL = {dep: null, names: null};       // what the running job is working through

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, s = '') => v === null || v === undefined ? '—' : v + s;

function flash(el, kind, msg){
  el.className = 'flash ' + kind; el.innerHTML = msg;
  if (kind === 'good') setTimeout(() => { el.className = 'flash'; }, 6000);
}

function renderStorage(st){
  if (!rootTouched) $('#root').value = st.root || '';
  const d = $('#disk');
  if (st.free_gb === null){ d.textContent = ''; return; }
  const low = st.free_gb < 20;
  d.className = 'disk' + (low ? ' low' : '');
  d.innerHTML = `<b>${st.free_gb} GB</b> free of ${st.total_gb} GB` +
    (st.shared ? '' : ' · deployments are in different folders') +
    (st.writable ? '' : ' · <b>not writable</b>') +
    (low ? ' · running low' : '');
}

async function state(){
  const s = await (await fetch('/api/state')).json();
  renderStorage(s.storage);
  s.deployments.forEach(d => { SIG[d.key] = d.sig; });
  $('#cards').innerHTML = s.deployments.map(d => `
    <div class="card" data-site="${d.site}" data-dep="${d.key}">
      <div class="chead">
        <div>
          <h2>${esc(d.label)}</h2>
          <div class="rec">${esc(d.recorder)}${d.unit ? ' · ' + esc(d.unit) : ''} · ${esc(d.audio)}</div>
          ${d.exists ? '' : '<div class="rec" style="color:var(--bad)">folder not found</div>'}
        </div>
        <div class="stats">
          <div class="stat"><b>${d.recordings}</b><span>recordings</span></div>
          <div class="stat"><b>${d.processed}</b><span>analysed</span></div>
          <div class="stat new ${d.new ? '' : 'zero'}"><b>${d.new}</b><span>to run</span></div>
        </div>
      </div>
      ${d.note ? `<p class="note">${esc(d.note)}</p>` : ''}
      <div class="row">
        <button data-cmd="process" data-site="${d.site}" data-dep="${d.key}" ${d.new ? '' : 'disabled'}>
          Run model on new${d.new ? ` (${d.new})` : ''}</button>
        <button data-cmd="dashboard" data-site="${d.site}" data-dep="${d.key}">Rebuild dashboard</button>
        ${d.dashboard ? `<a class="btn" href="${d.dashboard}" target="_blank"><button>Open ▸</button></a>` : ''}
        <button class="small toggle" data-site="${d.site}" data-dep="${d.key}">Files ${FILES[d.key] ? '▴' : '▾'}</button>
      </div>
      <div class="warnbox" id="warn-${d.key}"></div>
      <div class="files" id="files-${d.key}" hidden></div>
      <div class="dz" id="dz-${d.key}">Drop .wav recordings here, or click to choose
        <input type="file" multiple accept=".wav,.WAV" hidden id="in-${d.key}">
        <div class="prog" id="pr-${d.key}"><i></i></div>
      </div>
    </div>`).join('');
  for (const d of s.deployments) if (FILES[d.key]) loadFiles(d.site, d.key);
}

async function loadFiles(site, dep){
  const r = await (await fetch(`/api/files?site=${site}&deployment=${dep}`)).json();
  FILES[dep] = r.files;
  const box = $(`#files-${dep}`);
  box.hidden = false;
  box.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:26px"><input type="checkbox" class="all" data-dep="${dep}"></th>
        <th>recording</th><th>starts</th><th class="num">min</th><th class="num">MB</th>
        <th>status</th><th class="num">detections</th><th>analysed</th>
      </tr></thead>
      <tbody>${r.files.map(f => `
        <tr data-name="${esc(f.name)}" class="${(FRESH[dep] || []).includes(f.name) ? 'fresh' : ''}">
          <td><input type="checkbox" class="pick" data-dep="${dep}" value="${esc(f.name)}"
              ${f.status === 'missing' || f.status === 'unparseable' ? 'disabled' : ''}></td>
          <td class="name">${esc(f.name)}</td>
          <td class="name">${fmt(f.starts)}</td>
          <td class="num">${fmt(f.minutes)}</td>
          <td class="num">${fmt(f.mb)}</td>
          <td class="st"><span class="pill p-${f.status}">${f.status}</span></td>
          <td class="num">${fmt(f.detections)}</td>
          <td class="name">${fmt(f.processed_at)}</td>
        </tr>`).join('')}</tbody>
    </table>
    <div class="row">
      <button class="small" data-picknew="${dep}">Select all unprocessed</button>
      <button class="small" data-pickclear="${dep}">Clear</button>
      <button class="small primary" data-runsel="${dep}" data-site="${site}" disabled>Run selected</button>
    </div>`;
  syncSel(dep);
}

function syncSel(dep){
  const n = document.querySelectorAll(`.pick[data-dep="${dep}"]:checked`).length;
  const b = document.querySelector(`[data-runsel="${dep}"]`);
  if (b){ b.disabled = !n; b.textContent = n ? `Run selected (${n})` : 'Run selected'; }
}

function busy(on){ document.querySelectorAll('button[data-cmd],[data-runsel]').forEach(b => {
  if (on) b.disabled = true; else if (!b.dataset.runsel) b.disabled = false; });
  if (!on) Object.keys(FILES).forEach(syncSel); }

const clock = s => s == null ? '' :
  (s >= 3600 ? `${Math.floor(s/3600)}h ${Math.round(s%3600/60)}m`
   : s >= 60  ? `${Math.floor(s/60)}m ${Math.round(s%60)}s`
              : `${Math.round(s)}s`);

// Paint per-file state onto the open table: cued -> running (with a bar) -> processed.
// The client knows the SELECTION it submitted; the server reports which of those are
// active and which are done, so anything selected but not yet either is cued.
function paintRows(j){
  if (!JOBSEL.names) return;
  const active = new Map((j.active || []).map(a => [a.name, a]));
  const done = new Set(j.completed || []);
  document.querySelectorAll(`tr[data-name]`).forEach(tr => {
    const name = tr.dataset.name, cell = tr.querySelector('td.st');
    if (!cell || !JOBSEL.names.includes(name)) return;
    const a = active.get(name);
    if (a){
      tr.classList.add('active');
      const bar = a.pct == null
        ? '<div class="rowbar indet"><i></i></div>'
        : `<div class="rowbar"><i style="width:${a.pct}%"></i></div>`;
      cell.innerHTML = `<span class="pill p-running">running</span>${bar}`;
    } else if (done.has(name)){
      tr.classList.remove('active');
      cell.innerHTML = '<span class="pill p-processed">processed</span>';
    } else if (j.status === 'running'){
      tr.classList.remove('active');
      cell.innerHTML = '<span class="pill p-cued">Cued</span>';
    }
  });
}

async function start(body){
  if (poll) return;
  JOBSEL = {dep: body.deployment, names: body.only ? [...body.only] : null};
  if (!JOBSEL.names && body.deployment && FILES[body.deployment]){
    // A plain "run new" acts on exactly the unprocessed rows, so the table can show
    // those as cued without the server having to enumerate them.
    JOBSEL.names = FILES[body.deployment]
      .filter(f => f.status === 'new' || f.status === 'changed').map(f => f.name);
  }
  seen = 0; $('#log').textContent = ''; busy(true);
  const bar = $('#jbar') || document.querySelector('.jbar');
  $('#job').hidden = false;
  bar.className = 'jbar indet';
  $('#jphase').textContent = body.only ? `${body.only.length} selected recording(s)` : body.command;
  $('#jcount').textContent = ''; $('#jcur').textContent = 'starting…'; $('#jtime').textContent = '';
  const r = await (await fetch('/api/run', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
  poll = setInterval(() => tick(r.job), 700);
  tick(r.job);
}

function renderProgress(j){
  const bar = document.querySelector('.jbar'), fill = $('#jfill'), ghost = $('#jghost');
  if (j.phase) $('#jphase').textContent = j.phase;
  if (j.total > 0){
    // `done` counts COMPLETED files. Files run concurrently, so also show the ones in
    // flight -- otherwise the first whole batch reads as 0% and looks hung.
    const pct = 100 * j.done / j.total;
    const ghostPct = Math.min(100, 100 * (j.done + (j.running || 0)) / j.total);
    bar.className = 'jbar' + (j.status === 'running' ? '' : ' ' + j.status);
    fill.style.width = pct.toFixed(1) + '%';
    ghost.style.width = ghostPct.toFixed(1) + '%';
    $('#jcount').textContent = `${j.done} / ${j.total} done` +
      (j.running ? ` · ${j.running} running` : '') + `  (${pct.toFixed(0)}%)`;
    $('#jcur').textContent = j.current || '';
  } else {
    bar.className = 'jbar' + (j.status === 'running' ? ' indet' : ' ' + j.status);
    ghost.style.width = '0';
    if (j.status !== 'running') fill.style.width = '100%';
    $('#jcount').textContent = '';
  }
  $('#jtime').textContent = clock(j.elapsed) +
    (j.eta ? ` elapsed · ~${clock(j.eta)} left` : ' elapsed');
}

async function tick(id){
  const j = await (await fetch(`/api/jobs/${id}?since=${seen}`)).json();
  if (j.lines.length){
    $('#log').textContent += j.lines.join('\n') + '\n';
    $('#log').scrollTop = $('#log').scrollHeight;
    seen = j.n;
  }
  renderProgress(j);
  paintRows(j);
  $('#status').innerHTML = `<span class="dot ${j.status}"></span>${j.status} · ${clock(j.elapsed)}` +
    (j.returncode ? ` · exit ${j.returncode}` : '');
  if (j.status !== 'running'){
    clearInterval(poll); poll = null; busy(false); JOBSEL = {dep:null, names:null};
    if (j.status === 'done'){ $('#jcur').textContent = 'finished'; document.querySelector('.jbar').className = 'jbar done'; $('#jfill').style.width = '100%'; }
    state();
  }
}

// --- uploads: one PUT per file, streamed, with progress ------------------------------
function upload(site, dep, files){
  const bar = $(`#pr-${dep}`), fill = bar.querySelector('i'), warn = $(`#warn-${dep}`);
  const list = [...files].filter(f => /\.wav$/i.test(f.name));
  if (!list.length) return;
  bar.classList.add('on');
  const notes = [];
  let i = 0;
  const next = () => {
    if (i >= list.length){
      bar.classList.remove('on'); fill.style.width = '0';
      if (notes.length){ warn.style.display = 'block'; warn.innerHTML = notes.join('<br>'); }
      state(); loadFiles(site, dep);
      return;
    }
    const f = list[i++];
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', `/api/files/${site}/${dep}/${encodeURIComponent(f.name)}`);
    xhr.upload.onprogress = e => {
      const frac = (i - 1 + (e.loaded / e.total)) / list.length;
      fill.style.width = (frac * 100).toFixed(1) + '%';
    };
    xhr.onload = () => {
      try {
        const r = JSON.parse(xhr.responseText);
        if (xhr.status >= 400) notes.push(`✗ ${esc(f.name)}: ${esc(r.detail || xhr.status)}`);
        else if (r.warning) notes.push(`⚠ ${esc(r.warning)}`);
      } catch { notes.push(`✗ ${esc(f.name)}: HTTP ${xhr.status}`); }
      next();
    };
    xhr.onerror = () => { notes.push(`✗ ${esc(f.name)}: transfer failed`); next(); };
    xhr.send(f);
  };
  next();
}

// --- events ---------------------------------------------------------------------------
document.addEventListener('click', e => {
  const t = e.target;
  const cmd = t.closest('button[data-cmd]');
  if (cmd && !cmd.disabled){
    return start({command:cmd.dataset.cmd, site:cmd.dataset.site || null,
                  deployment:cmd.dataset.dep || null, push:cmd.dataset.push === '1'});
  }
  const tog = t.closest('.toggle');
  if (tog){
    const dep = tog.dataset.dep, box = $(`#files-${dep}`);
    if (FILES[dep] && !box.hidden){ box.hidden = true; delete FILES[dep]; tog.textContent = 'Files ▾'; }
    else { loadFiles(tog.dataset.site, dep); tog.textContent = 'Files ▴'; }
    return;
  }
  if (t.dataset.picknew){
    document.querySelectorAll(`.pick[data-dep="${t.dataset.picknew}"]`).forEach(c => {
      const s = FILES[t.dataset.picknew].find(f => f.name === c.value);
      c.checked = !c.disabled && (s.status === 'new' || s.status === 'changed');
    });
    return syncSel(t.dataset.picknew);
  }
  if (t.dataset.pickclear){
    document.querySelectorAll(`.pick[data-dep="${t.dataset.pickclear}"]`).forEach(c => c.checked = false);
    return syncSel(t.dataset.pickclear);
  }
  const rs = t.closest('[data-runsel]');
  if (rs && !rs.disabled){
    const dep = rs.dataset.runsel;
    const only = [...document.querySelectorAll(`.pick[data-dep="${dep}"]:checked`)].map(c => c.value);
    return start({command:'process', site:rs.dataset.site, deployment:dep, only});
  }
});

document.addEventListener('change', e => {
  if (e.target.classList.contains('pick')) syncSel(e.target.dataset.dep);
  if (e.target.classList.contains('all')){
    const dep = e.target.dataset.dep;
    document.querySelectorAll(`.pick[data-dep="${dep}"]`).forEach(c => {
      if (!c.disabled) c.checked = e.target.checked; });
    syncSel(dep);
  }
  if (e.target.type === 'file' && e.target.id.startsWith('in-')){
    const dep = e.target.id.slice(3);
    const card = e.target.closest('.card');
    upload(card.dataset.site, dep, e.target.files);
    e.target.value = '';
  }
});

document.addEventListener('dragover', e => {
  const dz = e.target.closest('.dz'); if (!dz) return;
  e.preventDefault(); dz.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const dz = e.target.closest('.dz'); if (dz) dz.classList.remove('over');
});
document.addEventListener('drop', e => {
  const dz = e.target.closest('.dz'); if (!dz) return;
  e.preventDefault(); dz.classList.remove('over');
  const card = dz.closest('.card');
  upload(card.dataset.site, card.dataset.dep, e.dataTransfer.files);
});
document.addEventListener('click', e => {
  const dz = e.target.closest('.dz');
  if (dz && e.target.tagName !== 'INPUT') dz.querySelector('input[type=file]').click();
});

// --- watching the recordings folder ---------------------------------------------------
// Recordings can land without going through this page (copied from a card in Explorer),
// so the panel re-scans on a timer and on demand. The scan is a stat per file, not an
// audio read, so it stays cheap on an external drive.
// Update the numbers on existing cards WITHOUT rebuilding them. Re-rendering #cards
// tears down any expanded file table and rebuilds it a moment later, which reads as a
// flash every 20 seconds -- and the common case for a poll is that nothing changed.
function updateCounts(deps){
  for (const d of deps){
    const card = document.querySelector(`.card[data-site="${d.site}"][data-dep="${d.key}"]`);
    if (!card) continue;
    const b = card.querySelectorAll('.stat b');
    if (b.length >= 3){
      b[0].textContent = d.recordings; b[1].textContent = d.processed; b[2].textContent = d.new;
    }
    const st = card.querySelector('.stat.new');
    if (st) st.classList.toggle('zero', !d.new);
    const btn = card.querySelector('button[data-cmd="process"]');
    if (btn && !poll){
      btn.disabled = !d.new;
      btn.textContent = 'Run model on new' + (d.new ? ` (${d.new})` : '');
    }
    SIG[d.key] = d.sig;
  }
}

async function check(manual){
  if (poll) return;                                  // a job is running; its own refresh follows
  const s = await (await fetch('/api/state')).json();
  renderStorage(s.storage);
  $('#watch').textContent = 'last checked ' + new Date().toLocaleTimeString();

  const known = Object.keys(SIG).length > 0;
  const changed = s.deployments.filter(d => SIG[d.key] !== undefined && SIG[d.key] !== d.sig);
  const structural = s.deployments.length !== document.querySelectorAll('.card').length;
  const pending = s.deployments.reduce((a, d) => a + d.new, 0);
  const el = $('#storeMsg');

  if (!changed.length && !structural){
    updateCounts(s.deployments);                     // nothing moved: no DOM teardown
    if (manual) flash(el, 'info', known ? `No new recordings. ${pending} unprocessed.` : 'Scanned.');
    return;
  }

  // Something really did change, so work out what arrived before rebuilding.
  let arrivals = 0;
  for (const d of changed){
    if (!FILES[d.key]) continue;
    const before = new Set(FILES[d.key].map(f => f.name));
    const now = await (await fetch(`/api/files?site=${d.site}&deployment=${d.key}`)).json();
    FRESH[d.key] = now.files.filter(f => !before.has(f.name)).map(f => f.name);
    arrivals += FRESH[d.key].length;
  }
  const open = Object.keys(FILES);
  await state();
  for (const d of s.deployments) if (open.includes(d.key)) await loadFiles(d.site, d.key);
  flash(el, 'good', arrivals
    ? `Found ${arrivals} new recording${arrivals === 1 ? '' : 's'} — ${pending} now unprocessed.`
    : `Folder contents changed — ${pending} unprocessed.`);
}

function startWatching(){
  if (watchTimer) clearInterval(watchTimer);
  watchTimer = setInterval(() => check(false), 20000);
}

$('#check').addEventListener('click', () => check(true));

// --- storage folder --------------------------------------------------------------------
$('#root').addEventListener('input', () => { rootTouched = true; });

$('#browse').addEventListener('click', async () => {
  const b = $('#browse'); b.disabled = true; b.textContent = 'Choose…';
  try {
    const r = await (await fetch('/api/browse', {method:'POST'})).json();
    if (r.path){ $('#root').value = r.path; rootTouched = true; }
  } catch { flash($('#storeMsg'), 'bad', 'Could not open the folder picker.'); }
  b.disabled = false; b.textContent = 'Browse…';
});

$('#saveRoot').addEventListener('click', async () => {
  const root = $('#root').value.trim();
  if (!root) return;
  const el = $('#storeMsg');
  const res = await fetch('/api/storage', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({root})});
  const r = await res.json();
  if (!res.ok){ return flash(el, 'bad', esc(r.detail || 'could not set that folder')); }
  rootTouched = false; SIG = {}; FRESH = {};
  const lines = r.deployments.map(d =>
    `${esc(d.deployment)} → ${esc(d.to)} (${d.recordings} recordings${d.manifest ? '' : ', no manifest'})`);
  flash(el, r.warnings.length ? 'info' : 'good',
        `Now storing in <b>${esc(r.root)}</b><br>` + lines.join('<br>') +
        (r.warnings.length ? '<br><br>' + r.warnings.map(esc).join('<br>') : ''));
  await state();
});

$('#refresh').addEventListener('click', () => check(true));
state().then(startWatching);
</script>
