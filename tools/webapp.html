<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn Chorus — control panel</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121926; --edge:#1e2a3d; --ink:#eef2f8; --dim:#8fa3bf;
    --accent:#5eead4; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--edge)}
  h1{margin:0;font-size:19px;letter-spacing:.2px}
  h1 span{color:var(--dim);font-weight:400}
  .sub{color:var(--dim);font-size:13px;margin-top:5px}
  main{padding:22px 28px;max-width:1080px}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px}
  .card h2{margin:0 0 2px;font-size:15px}
  .card .rec{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .stats{display:flex;gap:18px;margin:12px 0 6px}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .new b{color:var(--warn)}
  .new.zero b{color:var(--dim)}
  .note{color:var(--dim);font-size:12px;margin:8px 0 0;border-left:2px solid var(--edge);
        padding-left:9px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  button{background:#1b2740;color:var(--ink);border:1px solid var(--edge);border-radius:7px;
         padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){background:#24334f;border-color:#33456b}
  button.primary{background:var(--accent);color:#04231d;border-color:var(--accent);font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}
  a.btn{text-decoration:none;display:inline-block}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:20px 0 10px}
  #log{background:#070a10;border:1px solid var(--edge);border-radius:10px;padding:13px 15px;
       font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;
       min-height:150px;max-height:44vh;overflow:auto;color:#c9d6ea}
  .status{font-size:12.5px;color:var(--dim);margin:9px 0 0;font-family:var(--mono)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
  .dot.running{background:var(--warn);animation:p 1s infinite}
  .dot.done{background:var(--ok)} .dot.failed{background:var(--bad)}
  @keyframes p{50%{opacity:.3}}
  .hint{color:var(--dim);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Dawn Chorus <span>— control panel</span></h1>
  <div class="sub">Recordings and inference stay on this machine. Only detections are ever published.</div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="bar">
    <button class="primary" data-cmd="all">Process all new + rebuild dashboards</button>
    <button data-cmd="compare">Compare recorders</button>
    <button data-cmd="publish">Publish (commit)</button>
    <button data-cmd="publish" data-push="1">Publish + push live</button>
    <button id="refresh">Refresh</button>
  </div>

  <div id="log">Ready.</div>
  <div class="status" id="status"></div>
  <div class="hint">Processing is incremental — only recordings not already in the manifest are analysed.</div>
</main>

<script>
const $ = s => document.querySelector(s);
let poll = null, seen = 0;

async function state(){
  const s = await (await fetch('/api/state')).json();
  $('#cards').innerHTML = s.deployments.map(d => `
    <div class="card">
      <h2>${d.label}</h2>
      <div class="rec">${d.recorder}${d.unit ? ' · ' + d.unit : ''} · ${d.audio}/</div>
      <div class="stats">
        <div class="stat"><b>${d.recordings}</b><span>recordings</span></div>
        <div class="stat"><b>${d.processed}</b><span>processed</span></div>
        <div class="stat new ${d.new ? '' : 'zero'}"><b>${d.new}</b><span>new</span></div>
      </div>
      ${d.note ? `<p class="note">${d.note}</p>` : ''}
      <div class="row">
        <button data-cmd="process" data-site="${d.site}" data-dep="${d.key}"
          ${d.new ? '' : 'disabled'}>Run model${d.new ? ` (${d.new})` : ''}</button>
        <button data-cmd="dashboard" data-site="${d.site}" data-dep="${d.key}">Rebuild dashboard</button>
        ${d.dashboard ? `<a class="btn" href="${d.dashboard}" target="_blank"><button>Open ▸</button></a>` : ''}
      </div>
    </div>`).join('');
}

function busy(on){ document.querySelectorAll('button[data-cmd]').forEach(b => b.disabled = on); }

async function start(body){
  if (poll) return;
  seen = 0; $('#log').textContent = ''; busy(true);
  const r = await (await fetch('/api/run', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
  poll = setInterval(() => tick(r.job), 700);
  tick(r.job);
}

async function tick(id){
  const j = await (await fetch(`/api/jobs/${id}?since=${seen}`)).json();
  if (j.lines.length){
    $('#log').textContent += j.lines.join('\n') + '\n';
    $('#log').scrollTop = $('#log').scrollHeight;
    seen = j.n;
  }
  $('#status').innerHTML =
    `<span class="dot ${j.status}"></span>${j.status} · ${j.elapsed}s` +
    (j.returncode !== null && j.returncode !== 0 ? ` · exit ${j.returncode}` : '');
  if (j.status !== 'running'){
    clearInterval(poll); poll = null; busy(false); state();
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-cmd]');
  if (!b || b.disabled) return;
  start({command:b.dataset.cmd, site:b.dataset.site || null,
         deployment:b.dataset.dep || null, push:b.dataset.push === '1'});
});
$('#refresh').addEventListener('click', state);
state();
</script>
</body>
</html>
